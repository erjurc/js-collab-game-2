<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ucieczka z serwerowni</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    .container {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      border: 1px solid #334155;
    }
    h1 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }
    code {
      background-color: #0f172a;
      color: #38bdf8;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.95em;
      border: 1px solid #334155;
    }
  </style>
  <script src="./engine.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>Ucieczka z serwerowni</h1>
    <p>Otwórz konsolę dewelopera (F12 → Console) i wpisz <code>pomoc()</code>.</p>
    <p>Kod edytuj w app.js. Po zapisaniu odśwież stronę.</p>
  </div>
</body>
</html>
